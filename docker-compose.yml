services:
  omni-gateway-api:
    image: ${OMNI_GATEWAY_IMAGE:-eceasy/omni-gateway-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: omni-gateway-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${OMNI_GATEWAY_CONFIG_PATH:-./config.yaml}:/OmniGatewayAPI/config.yaml
      - ${OMNI_GATEWAY_AUTH_PATH:-./auths}:/root/.omni-gateway-api
      - ${OMNI_GATEWAY_LOG_PATH:-./logs}:/OmniGatewayAPI/logs
      - ${OMNI_GATEWAY_PLUGIN_PATH:-./plugins}:/OmniGatewayAPI/plugins
    restart: unless-stopped
